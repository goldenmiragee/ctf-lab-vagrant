<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16202b"/>
      <stop offset="0.6" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6f4d"/>
      <stop offset="1" stop-color="#39d98a"/>
    </linearGradient>
  </defs>

  <rect width="860" height="500" fill="url(#bg)"/>

  <!-- top bar -->
  <rect x="0" y="0" width="860" height="66" fill="#0b0f14" opacity="0.85"/>
  <line x1="0" y1="66" x2="860" y2="66" stroke="#223040"/>
  <text x="24" y="34" font-size="26">🛡️</text>
  <text x="58" y="30" fill="#d6e2ef" font-size="17" font-weight="bold">ctf-lab-vagrant</text>
  <text x="58" y="48" fill="#7d8fa3" font-size="11">local scoreboard — capture flags, unlock the next</text>
  <text x="612" y="30" fill="#7d8fa3" font-size="12"><tspan fill="#39d98a" font-weight="bold">12</tspan> / 90 flags</text>
  <rect x="690" y="22" width="120" height="8" rx="4" fill="#0e141b" stroke="#223040"/>
  <rect x="690" y="22" width="16" height="8" rx="4" fill="url(#bar)"/>
  <rect x="820" y="18" width="18" height="16" rx="4" fill="none" stroke="#223040"/>

  <!-- tabs -->
  <g font-size="12.5">
    <rect x="24" y="86" width="150" height="34" rx="8" fill="#121820" stroke="#223040"/>
    <text x="36" y="108" fill="#39d98a">ubuntu-server <tspan fill="#39d98a" font-size="11">3/22</tspan></text>
    <rect x="180" y="86" width="140" height="34" rx="8" fill="#0e141b" stroke="#223040"/>
    <text x="192" y="108" fill="#7d8fa3">ubuntu-client <tspan font-size="11">2/20</tspan></text>
    <rect x="326" y="86" width="86" height="34" rx="8" fill="#0e141b" stroke="#223040"/>
    <text x="338" y="108" fill="#7d8fa3">dvwa <tspan font-size="11">4/16</tspan></text>
    <rect x="418" y="86" width="112" height="34" rx="8" fill="#0e141b" stroke="#223040"/>
    <text x="430" y="108" fill="#7d8fa3">juiceshop <tspan font-size="11">3/13</tspan></text>
    <rect x="536" y="86" width="150" height="34" rx="8" fill="#0e141b" stroke="#223040"/>
    <text x="548" y="108" fill="#7d8fa3">metasploitable <tspan font-size="11">0/11</tspan></text>
    <rect x="692" y="86" width="72" height="34" rx="8" fill="#0e141b" stroke="#223040"/>
    <text x="704" y="108" fill="#7d8fa3">dc01 <tspan font-size="11">0/8</tspan></text>
  </g>

  <!-- panel -->
  <rect x="24" y="120" width="812" height="356" rx="10" fill="#121820" stroke="#223040"/>

  <!-- BASIC track -->
  <text x="44" y="150" fill="#7d8fa3" font-size="12" letter-spacing="1.5">● BASIC · 3/8</text>
  <line x1="44" y1="158" x2="816" y2="158" stroke="#223040" stroke-dasharray="4 4"/>

  <!-- flag card: solved -->
  <rect x="44" y="170" width="772" height="70" rx="8" fill="#0e141b" stroke="#1f6f4d"/>
  <text x="60" y="192" fill="#39d98a" font-size="13" font-weight="bold">SRV_B01 ✅</text>
  <text x="740" y="192" fill="#7d8fa3" font-size="11">recon/info-disclosure</text>
  <text x="60" y="211" fill="#d6e2ef" font-size="12">A web root leaves a file exposed that should never be public. Read it.</text>
  <rect x="60" y="218" width="640" height="15" rx="4" fill="#0a0e13" stroke="#39d98a"/>
  <text x="68" y="229" fill="#39d98a" font-size="11">••••••••••••</text>
  <rect x="710" y="218" width="90" height="15" rx="4" fill="none" stroke="#223040"/>
  <text x="742" y="229" fill="#7d8fa3" font-size="10">done</text>

  <!-- flag card: active -->
  <rect x="44" y="250" width="772" height="70" rx="8" fill="#0e141b" stroke="#223040"/>
  <text x="60" y="272" fill="#39d98a" font-size="13" font-weight="bold">SRV_B02 🔓</text>
  <text x="742" y="272" fill="#7d8fa3" font-size="11">default-credentials</text>
  <text x="60" y="291" fill="#d6e2ef" font-size="12">A service account still uses a trivial password. Log in over SSH and read the flag.</text>
  <rect x="60" y="298" width="640" height="15" rx="4" fill="#0a0e13" stroke="#4a5b6d"/>
  <text x="68" y="309" fill="#7d8fa3" font-size="11">enter flag / answer…</text>
  <rect x="710" y="298" width="90" height="15" rx="4" fill="#1f6f4d" stroke="#39d98a"/>
  <text x="736" y="309" fill="#eafff4" font-size="10">submit</text>

  <!-- MEDIUM track -->
  <text x="44" y="352" fill="#7d8fa3" font-size="12" letter-spacing="1.5">● MEDIUM · 0/8</text>
  <line x1="44" y1="360" x2="816" y2="360" stroke="#223040" stroke-dasharray="4 4"/>

  <!-- flag card: locked -->
  <g opacity="0.45">
    <rect x="44" y="372" width="772" height="70" rx="8" fill="#0e141b" stroke="#223040"/>
    <text x="60" y="394" fill="#39d98a" font-size="13" font-weight="bold">SRV_M01 🔒</text>
    <text x="720" y="394" fill="#7d8fa3" font-size="11">privesc/sudo</text>
    <text x="60" y="413" fill="#d6e2ef" font-size="12">The 'deploy' user can run a binary via sudo without a password. Escalate to root.</text>
    <rect x="60" y="420" width="640" height="15" rx="4" fill="#0a0e13" stroke="#223040"/>
    <text x="68" y="431" fill="#7d8fa3" font-size="10">locked — solve the previous flag first</text>
    <rect x="710" y="420" width="90" height="15" rx="4" fill="none" stroke="#223040"/>
    <text x="742" y="431" fill="#7d8fa3" font-size="10">submit</text>
  </g>

  <text x="430" y="464" fill="#7d8fa3" font-size="10" text-anchor="middle">Isolated lab · answers validated locally (SHA-256) · no data leaves your browser</text>
</svg>
